<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>Quét tem nhãn</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--denim:#1d3557;--ink:#14213d;--amber:#ffb703;--ok:#2fbf71;--err:#e5383b}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;color:#fff;font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden}
  #top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(20,33,61,.94);align-items:center}
  #pick{position:relative;flex:1 1 42%;min-width:0}
  #giao,#don{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:0;background:#fff;color:var(--ink)}
  #don{flex:1 1 42%;min-width:0}
  #sug{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:42vh;overflow:auto;background:#fff;color:var(--ink);border-radius:10px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #sug button{display:block;width:100%;text-align:left;background:none;color:var(--ink);border-radius:0;padding:12px;font-weight:600;border-bottom:1px solid #e3e7ef}
  #reload{background:#fff;color:var(--ink);padding:5px 12px;font-size:16px;border-radius:20px}
  .pill{background:var(--amber);color:var(--ink);font-weight:800;border-radius:20px;padding:5px 12px;font-size:14px;white-space:nowrap}
  #pend{background:#fff}
  #err{position:absolute;top:118px;left:10px;right:10px;z-index:4;background:var(--err);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;display:none}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #guide{position:absolute;left:5%;right:5%;top:26%;height:34%;border:3px solid var(--amber);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
  #guide.ok{border-color:var(--ok)}#guide.bad{border-color:var(--err)}
  #plus{position:absolute;left:0;right:0;top:33%;text-align:center;z-index:4;font-size:88px;font-weight:800;color:var(--ok);text-shadow:0 2px 14px rgba(0,0,0,.8);pointer-events:none;opacity:0}
  #plus.go{animation:pop .8s ease-out}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
  @keyframes fade{0%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){#plus.go{animation:fade .8s}}
  #bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.88) 30%);display:grid;gap:8px}
  #first{font-size:26px;font-weight:800;line-height:1.15;word-break:break-all}
  #txt{font-size:13px;opacity:.9;white-space:pre-wrap;max-height:5.6em;overflow:hidden}
  #meta{font-size:12px;opacity:.7;min-height:16px}
  #row{display:flex;gap:10px}
  button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px;cursor:pointer}
  #shot{flex:1;background:var(--amber);color:var(--ink);font-size:20px;padding:18px}
  #auto{background:#fff;color:var(--ink)}#auto.on{background:var(--ok);color:#fff}
  #undo{background:rgba(255,255,255,.18);color:#fff}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="top">
  <div id="pick"><input id="giao" type="search" placeholder="Tìm Giao hàng" autocomplete="off" aria-label="Tìm Giao hàng"><div id="sug"></div></div>
  <select id="don" disabled aria-label="Đơn hàng"><option value="">Đơn hàng</option></select>
  <button id="reload" aria-label="Làm mới danh sách đơn hàng">↻</button><span class="pill" id="cnt">Quét 0</span><span class="pill" id="pend">Chờ 0</span>
</div>
<div id="err" role="alert"></div>
<video id="cam" playsinline muted autoplay></video>
<div id="guide"></div>
<div id="plus" aria-hidden="true">+1</div>
<div id="bottom">
  <div><div id="first">Đang khởi động…</div><div id="txt"></div><div id="meta"></div></div>
  <div id="row"><button id="auto" class="on">Tự quét: Bật</button><button id="shot">QUÉT</button><button id="undo">Hủy</button></div>
</div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
// ===== CẤU HÌNH =====
const API_URL = 'https://script.google.com/macros/s/AKfycbwi9N3_C_89op4mz8qwis1mGURGXjYgYeguv16HObgQZuizDQVgUOU-4Jaq9I0FAsZ5/exec';
const KEY = '12345678';   // phải giống KEY trong Code.gs
const MODE = 'hybrid';             // 'hybrid' | 'local' | 'server' (server = chỉ quét tay)
const LANG = 'vie';
const MIN_CONF = 55, LOW_CONF = 75, FLUSH_MS = 4000, FLUSH_N = 40, MAX_W = 1600;
// Tự quét: tem đứng yên ~0,15s là đọc ngay; chỉ đọc lại khi hình trong khung thay đổi
const POLL_MS = 60, STABLE_DIFF = 5, STABLE_FRAMES = 2, CHANGE_DIFF = 18, DUP_MS = 1500;
// =====================
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
let worker = null, localOK = false, auto = true, low = 0, lastText = '', lastT = 0;
let jobs = [], queue = [], scanned = 0, sending = false, stream = null, audio = null;
let orders = [], giaoList = [], cur = { giao: '', don: '' };
try { queue = JSON.parse(localStorage.getItem('q') || '[]'); } catch (e) {}

const api = (action, p) => fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
  body: JSON.stringify(Object.assign({ key: KEY, action: action }, p || {})) })
  .then(r => r.text()).then(t => {
    let j; try { j = JSON.parse(t); } catch (e) { throw new Error('API trả về trang web thay vì dữ liệu. Kiểm tra API_URL (phải là link /exec), quyền truy cập "Bất kỳ ai" và đã triển khai Phiên bản mới.'); }
    if (!j.ok) throw new Error(j.error || 'Lỗi máy chủ'); return j; });
const persist = () => { try { localStorage.setItem('q', JSON.stringify(queue)); } catch (e) {} };
const ui = () => { $('cnt').textContent = 'Quét ' + scanned; $('pend').textContent = 'Chờ ' + (queue.length + jobs.length); };
const showErr = m => { $('err').textContent = m || ''; $('err').style.display = m ? 'block' : 'none'; };
const flash = c => { const g = $('guide'); g.className = c; setTimeout(() => g.className = '', 350); };
const plus = () => { const p = $('plus'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); };

// Âm thanh: bíp 2 nốt khi đọc được, 1 nốt trầm khi lỗi
function getAudio(){ if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (audio && audio.state === 'suspended') audio.resume(); return audio; }
document.addEventListener('pointerdown', getAudio, { passive: true });
function tone(f, at, d){ const a = getAudio(); if (!a) return; const o = a.createOscillator(), g = a.createGain();
  o.frequency.value = f; g.gain.value = .18; o.connect(g); g.connect(a.destination); o.start(a.currentTime + at); o.stop(a.currentTime + at + d); }
function beep(ok){ try { if (ok) { tone(880, 0, .07); tone(1320, .08, .09); } else tone(220, 0, .22); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 40 : [80, 60, 80]); }

const tidy = t => String(t).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, '');
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

// ===== 1) Tìm Giao hàng -> chọn Đơn hàng =====
let ordersT = 0;
function loadOrders(fresh, first){
  return api('orders', { fresh: !!fresh }).then(j => {
    orders = j.orders; giaoList = Array.from(new Set(orders.map(o => o.giao))); ordersT = Date.now();
    let want = cur;
    if (first) { try { want = JSON.parse(localStorage.getItem('cur') || 'null') || cur; } catch (e) {} }
    if (want.giao && giaoList.indexOf(want.giao) >= 0) { cur.giao = want.giao; $('giao').value = want.giao; fillDon(want.giao, want.don); }
    else if (!first && cur.giao) { cur = { giao: '', don: '' }; $('giao').value = ''; fillDon(''); }
    if (!cur.giao) $('first').textContent = 'Tìm và chọn Giao hàng';
    $('meta').textContent = 'Đã cập nhật ' + giaoList.length + ' giao hàng · ' + orders.length + ' đơn';
  }).catch(e => showErr('Không nối được Google Sheet: ' + e.message));
}
loadOrders(false, true);
$('reload').onclick = () => { $('meta').textContent = 'Đang cập nhật danh sách…'; loadOrders(true); };
// Tự cập nhật khi mở lại app sau khi để nền hơn 1 phút
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - ordersT > 60000) loadOrders(true); });
function renderSug(q){
  const n = norm(q), sug = $('sug'); sug.innerHTML = '';
  giaoList.filter(g => norm(g).indexOf(n) >= 0).slice(0, 30).forEach(g => {
    const b = document.createElement('button'); b.textContent = g;
    b.onpointerdown = ev => { ev.preventDefault(); pickGiao(g); };
    sug.appendChild(b);
  });
  if (!sug.children.length && giaoList.length) { const d = document.createElement('div'); d.style.cssText = 'padding:12px;color:#555;font-size:14px'; d.textContent = 'Không thấy? Bấm ↻ để cập nhật danh sách.'; sug.appendChild(d); }
  sug.style.display = sug.children.length ? 'block' : 'none';
}
function pickGiao(g){ cur.giao = g; $('giao').value = g; $('sug').style.display = 'none'; $('giao').blur(); fillDon(g); }
function fillDon(g, keep){
  const s = $('don'), list = orders.filter(o => o.giao === g); s.innerHTML = ''; cur.don = '';
  if (!g || !list.length) { s.disabled = true; s.innerHTML = '<option value="">Đơn hàng</option>'; saveCur(); return; }
  s.disabled = false;
  if (list.length > 1) s.innerHTML = '<option value="">— Chọn đơn hàng —</option>';
  list.forEach(o => { const p = document.createElement('option'); p.value = o.don; p.textContent = o.don; s.appendChild(p); });
  cur.don = (keep && list.some(o => o.don === keep)) ? keep : (list.length === 1 ? list[0].don : '');
  s.value = cur.don; saveCur();
}
function saveCur(){ try { localStorage.setItem('cur', JSON.stringify(cur)); } catch (e) {} lastText = ''; holdSig = null; }
$('giao').oninput = e => { cur.giao = ''; fillDon(''); renderSug(e.target.value); };
$('giao').onfocus = e => { e.target.select(); renderSug(e.target.value); };
$('giao').onkeydown = e => { if (e.key === 'Enter') { const b = $('sug').firstChild; if (b) pickGiao(b.textContent); } };
$('don').onchange = () => { cur.don = $('don').value; saveCur(); };
const ready_ = () => !!(cur.giao && cur.don);

// ===== 2) Camera mở ngay =====
async function startCam(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    $('cam').srcObject = stream; await $('cam').play();
    try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  } catch (e) { showErr('Camera bị chặn (' + (e.name || 'lỗi') + '). Cho phép camera cho trang này rồi tải lại. Tạm thời dùng nút QUÉT để mở camera điện thoại.'); }
}

// ===== 3) Bộ đọc chữ =====
async function startOcr(){
  if (MODE !== 'server') {
    try {
      $('first').textContent = 'Đang nạp bộ đọc chữ…';
      worker = await Tesseract.createWorker(LANG, 1, { logger: () => {} });
      await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      localOK = true;
    } catch (e) { showErr('Không nạp được bộ đọc trên máy, dùng OCR Google (chậm hơn).'); }
  }
  if (!localOK) { auto = false; $('auto').style.display = 'none'; }
  $('first').textContent = ready_() ? 'Đưa tem vào khung' : 'Tìm và chọn Giao hàng';
}
const CROP = { x: .05, y: .26, w: .9, h: .34 };   // khớp khung vàng
function grab(src){
  const v = src || $('cam'), W = v.videoWidth || v.naturalWidth, H = v.videoHeight || v.naturalHeight;
  if (!W) return null;
  const c0 = src ? { x: 0, y: 0, w: W, h: H } : { x: W * CROP.x, y: H * CROP.y, w: W * CROP.w, h: H * CROP.h };
  const k = Math.min(1, MAX_W / c0.w), c = document.createElement('canvas');
  c.width = Math.round(c0.w * k); c.height = Math.round(c0.h * k);
  const x = c.getContext('2d'); x.filter = 'grayscale(1)';
  x.drawImage(v, c0.x, c0.y, c0.w, c0.h, 0, 0, c.width, c.height);
  return c;
}
// Ảnh thu nhỏ 128x64 để biết tem đã đứng yên chưa và hình có đổi không (rất nhẹ, không cần OCR)
const pc = document.createElement('canvas'); pc.width = 128; pc.height = 64;
const px = pc.getContext('2d', { willReadFrequently: true });
function probe(){
  const v = $('cam'), W = v.videoWidth, H = v.videoHeight; if (!W) return null;
  px.drawImage(v, W * CROP.x, H * CROP.y, W * CROP.w, H * CROP.h, 0, 0, 128, 64);
  const d = px.getImageData(0, 0, 128, 64).data, s = new Uint8Array(8192);
  for (let i = 0, j = 0; j < 8192; i += 4, j++) s[j] = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
  return s;
}
const sigDiff = (a, b) => { let t = 0, n = 0; for (let i = 0; i < a.length; i += 3, n++) t += Math.abs(a[i] - b[i]); return t / n; };

// Đọc cả tem (nhanh). Dòng đầu sẽ được đọc lại kỹ chỉ khi tem đã được chấp nhận.
async function readLocal(cv){
  const { data } = await worker.recognize(cv, {}, { text: true, blocks: true });
  let L = data.lines && data.lines[0];
  if (!L && data.blocks) { try { L = data.blocks[0].paragraphs[0].lines[0]; } catch (e) {} }
  return { text: tidy(data.text), conf: Math.round(data.confidence), L: L };
}
async function refineFirst(cv, res){
  const L = res.L; if (!L || !L.bbox) return;
  const lines = res.text.split('\n');
  try {
    const b = L.bbox, p = 8, x0 = Math.max(0, b.x0 - p), y0 = Math.max(0, b.y0 - p);
    const w = Math.min(cv.width, b.x1 + p) - x0, h = Math.min(cv.height, b.y1 + p) - y0;
    if (w < 20 || h < 8) return;
    const k = Math.min(3, 2400 / w), c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(cv, x0, y0, w, h, 0, 0, c.width, c.height);
    await worker.setParameters({ tessedit_pageseg_mode: '7' });
    const r = await worker.recognize(c);
    const first = tidy(r.data.text).split('\n')[0];
    if (first && r.data.confidence >= (L.confidence || 0) - 5) { lines[0] = first; res.text = lines.join('\n'); }
  } catch (e) {} finally { try { await worker.setParameters({ tessedit_pageseg_mode: '6' }); } catch (e) {} }
}
const serverOcr = cv => api('ocr', { image: cv.toDataURL('image/jpeg', .85).split(',')[1] }).then(j => tidy(j.text));

// ===== 4) Quét =====
function tap(){
  if ($('sug').style.display === 'block') { $('sug').style.display = 'none'; return; }
  if (!ready_()) { $('first').textContent = 'Chọn Giao hàng và Đơn hàng trước'; return; }
  if (!stream) return $('file').click();
  const cv = grab(); if (!cv) return;
  jobs.push({ cv: cv, g: cur.giao, d: cur.don }); ui(); flash('ok');
  if (navigator.vibrate) navigator.vibrate(20);
}
$('cam').onclick = $('shot').onclick = tap;
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (!f || !ready_()) return;
  const g = cur.giao, d = cur.don, im = new Image(); im.onload = () => { jobs.push({ cv: grab(im), g: g, d: d }); ui(); }; im.src = URL.createObjectURL(f); };

// Trả về true nếu đã ghi nhận tem
async function scan(manual, job){
  const t0 = performance.now(), cv = job.cv;
  try {
    let text = '', conf = 0, via = 'máy', res = null;
    if (localOK && MODE !== 'server') { res = await readLocal(cv); text = res.text; conf = res.conf; }
    let first = text.split('\n')[0] || '';
    let good = first.length >= 3 && conf >= MIN_CONF;
    if (MODE !== 'local' && conf < LOW_CONF && (manual || !localOK || (text.length >= 3 && ++low >= 2))) {
      $('first').textContent = 'Đang đọc chính xác…'; low = 0;
      try { text = await serverOcr(cv); conf = 100; via = 'Google'; res = null; } catch (e) { showErr('OCR Google lỗi: ' + e.message); }
      first = text.split('\n')[0] || ''; good = first.length >= 3;
    }
    if (good && res) { await refineFirst(cv, res); text = res.text; first = text.split('\n')[0] || first; }
    if (manual ? !text : !good) {
      if (manual) { flash('bad'); beep(false); $('first').textContent = 'Không đọc được, quét lại'; }
      return false;
    }
    const now = Date.now();
    if (!manual && text === lastText && now - lastT < DUP_MS) return false;   // chống đọc lặp do rung tay
    lastText = text; lastT = now; low = 0;
    const item = { t: now, giao: job.g, don: job.d, text: text };
    if (conf < LOW_CONF) item.image = cv.toDataURL('image/jpeg', .6).split(',')[1];
    queue.push(item); persist(); scanned++; ui(); flash('ok'); beep(true); plus();
    $('first').textContent = first; $('txt').textContent = text.split('\n').slice(1).join('\n');
    $('meta').textContent = job.g + ' · ' + job.d + ' · ' + via + ' ' + Math.round(performance.now() - t0) + ' ms';
    if (queue.length >= FLUSH_N) flush();
    return true;
  } catch (e) { $('first').textContent = 'Lỗi đọc, quét lại'; showErr(String(e.message || e)); return false; }
}

// Vòng lặp tự quét: tem đứng yên -> đọc 1 lần -> chờ hình đổi (rút tem / đổi tem) mới đọc tiếp
let prevSig = null, holdSig = null, stableN = 0, fails = 0;
async function loop(){
  while (true) {
    if (jobs.length) { await scan(true, jobs.shift()); ui(); }
    else if (auto && stream && localOK && ready_()) {
      const s = probe();
      if (s) {
        stableN = (prevSig && sigDiff(s, prevSig) < STABLE_DIFF) ? stableN + 1 : 0; prevSig = s;
        if (holdSig && sigDiff(s, holdSig) > CHANGE_DIFF) { holdSig = null; fails = 0; }
        if (stableN >= STABLE_FRAMES && !holdSig) {
          const cv = grab();
          if (cv) {
            const ok = await scan(false, { cv: cv, g: cur.giao, d: cur.don });
            if (ok || ++fails >= 2) { holdSig = s; fails = 0; }
          }
        }
      }
    }
    await sleep(POLL_MS);
  }
}
$('auto').onclick = () => { auto = !auto; $('auto').classList.toggle('on', auto); $('auto').textContent = 'Tự quét: ' + (auto ? 'Bật' : 'Tắt'); holdSig = null; fails = 0; };
$('undo').onclick = () => { if (queue.length) { queue.pop(); persist(); scanned = Math.max(0, scanned - 1); ui(); lastText = ''; $('first').textContent = 'Đã hủy tem vừa quét'; $('txt').textContent = ''; $('meta').textContent = ''; } else $('first').textContent = 'Tem đó đã gửi lên sheet'; };

// ===== 5) Gửi nền theo lô =====
function flush(){
  if (sending || !queue.length) return;
  sending = true; const batch = queue.splice(0, 60); persist();
  api('save', { items: batch }).then(() => { sending = false; ui(); showErr(''); })
    .catch(e => { sending = false; queue = batch.concat(queue); persist(); ui(); showErr('Chưa ghi được vào Sheet: ' + e.message + ' (sẽ tự gửi lại)'); });
}
setInterval(flush, FLUSH_MS);
window.addEventListener('beforeunload', e => { if (queue.length) { e.preventDefault(); e.returnValue = ''; } });
if (API_URL.indexOf('http') !== 0) showErr('Chưa dán link /exec của Apps Script vào API_URL trong Index.html');
ui(); startCam(); startOcr().then(loop);
</script>
</body>
</html>
